name: Deploy TestVault (ASP.NET Core) to IIS

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      health_url:
        description: "Override the base URL used for health checks (optional, e.g. https://testvault-uat.example.com)"
        required: false
        default: ""

concurrency:
  group: testvault-iis-deployment
  cancel-in-progress: false

jobs:
  deploy:

    runs-on: self-hosted

    env:
      APP_NAME: TestVault

      BASE_PATH: E:\AllWebApplication\TestVault
      RELEASE_PATH: E:\AllWebApplication\TestVault\Releases
      CURRENT_PATH: E:\AllWebApplication\TestVault\Current
      BACKUP_PATH: E:\AllWebApplication\TestVault\Backup

      IIS_SITE_NAME: TestVault
      IIS_APP_POOL: TestVault

      BUILD_CONFIGURATION: Release

      RELEASES_TO_KEEP: 5
      BACKUPS_TO_KEEP: 5

      STARTUP_WAIT_SECONDS: 15
      HEALTH_BASE_URL: http://localhost

    steps:

      # ======================================
      # Checkout
      # ======================================

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================
      # Analyze Project Structure
      # Locate the solution and the actual IIS-hosted web project from the
      # real repository contents - never hardcoded.
      # ======================================

      - name: Analyze Project Structure
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Analyzing Repository Structure"
          Write-Host "======================================"

          $workspace = "${{ github.workspace }}"

          $solutions = Get-ChildItem $workspace -Filter *.sln -Recurse -File -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -notmatch '\\(bin|obj|node_modules)\\' }

          if ($solutions.Count -eq 0) {
              throw "No .sln file found."
          }
          if ($solutions.Count -gt 1) {
              throw "Multiple .sln files found ($($solutions.Name -join ', ')). Refusing to guess which one to build."
          }

          $solution = $solutions[0].FullName
          Write-Host "Solution found: $solution"

          # Identified by SDK type (Microsoft.NET.Sdk.Web), not by name, so
          # this keeps working regardless of what the project is called.
          $csprojFiles = Get-ChildItem $workspace -Filter *.csproj -Recurse -File -ErrorAction SilentlyContinue |
                          Where-Object { $_.FullName -notmatch '\\(bin|obj|node_modules)\\' }

          $webProjects = $csprojFiles | Where-Object {
              (Get-Content $_.FullName -Raw) -match 'Sdk\s*=\s*"Microsoft\.NET\.Sdk\.Web"'
          }

          if ($webProjects.Count -eq 0) {
              throw "No project using the Microsoft.NET.Sdk.Web SDK was found. The IIS-hosted web project could not be identified."
          }
          if ($webProjects.Count -gt 1) {
              throw "Multiple Microsoft.NET.Sdk.Web projects found ($($webProjects.Name -join ', ')). Refusing to guess which one is the IIS-hosted app."
          }

          $webProject = $webProjects[0].FullName
          Write-Host "IIS-hosted web project found: $webProject"

          "SOLUTION=$solution"      >> $env:GITHUB_ENV
          "WEB_PROJECT=$webProject" >> $env:GITHUB_ENV

      # ======================================
      # Environment Validation
      #   - dotnet SDK present
      #   - IIS WebAdministration module available
      #   - Application Pool exists, and is actually configured the way an
      #     ASP.NET Core Module (ANCM) in-process app requires
      #   - IIS site exists
      # ======================================

      - name: Environment Validation
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Environment Validation"
          Write-Host "======================================"

          $dotnet = Get-Command dotnet.exe -ErrorAction SilentlyContinue
          if ($null -eq $dotnet) {
              throw ".NET SDK not found on this runner"
          }
          Write-Host "dotnet path   : $($dotnet.Source)"
          Write-Host "dotnet version: $(dotnet --version)"

          try {
              Import-Module WebAdministration -ErrorAction Stop
          } catch {
              throw "WebAdministration PowerShell module is not available. Install the 'IIS Management Scripts and Tools' Windows feature on this server."
          }

          $pool = Get-Item "IIS:\AppPools\${{ env.IIS_APP_POOL }}" -ErrorAction SilentlyContinue
          if ($null -eq $pool) {
              throw "Application Pool '${{ env.IIS_APP_POOL }}' does not exist. Create it in IIS before running this workflow - see docs/DEPLOYMENT.md."
          }
          Write-Host "Application Pool found: ${{ env.IIS_APP_POOL }} (state: $($pool.state))"

          # "No Managed Code" is represented by an EMPTY managedRuntimeVersion,
          # not a specific value - ANCM (which actually hosts the app in an
          # IIS worker process) requires this; a pool still configured for
          # classic ASP.NET (v4.0) will never host TestVault.Web correctly.
          if ($pool.managedRuntimeVersion -ne "") {
              throw "Application Pool '${{ env.IIS_APP_POOL }}' has .NET CLR Version = '$($pool.managedRuntimeVersion)', expected 'No Managed Code' (empty). Fix in IIS Manager: Application Pools -> ${{ env.IIS_APP_POOL }} -> Basic Settings -> .NET CLR version -> No Managed Code."
          }
          if ($pool.managedPipelineMode -ne "Integrated") {
              throw "Application Pool '${{ env.IIS_APP_POOL }}' has Managed Pipeline Mode = '$($pool.managedPipelineMode)', expected 'Integrated'."
          }
          Write-Host "Application Pool configuration OK (No Managed Code / Integrated)"

          $site = Get-Website -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue
          if ($null -eq $site) {
              throw "IIS site '${{ env.IIS_SITE_NAME }}' does not exist. Create it (bound to ${{ env.CURRENT_PATH }}) before running this workflow."
          }
          Write-Host "IIS site found: ${{ env.IIS_SITE_NAME }}"

          # The site EXISTING isn't enough - if its Physical Path doesn't
          # actually point at CURRENT_PATH, every deployment below will
          # keep succeeding (publish, backup, copy into Current, App Pool
          # starts) while IIS silently keeps serving whatever it was
          # already pointed at instead - a deployment that looks entirely
          # healthy right up until the Health Check step 404s on every
          # single route.
          $expectedPhysicalPath = "${{ env.CURRENT_PATH }}".TrimEnd('\')
          $actualPhysicalPath = "$($site.physicalPath)".Trim('"').TrimEnd('\')
          if ($actualPhysicalPath -ne $expectedPhysicalPath) {
              throw "IIS site '${{ env.IIS_SITE_NAME }}' has Physical Path = '$actualPhysicalPath', expected '$expectedPhysicalPath'. Fix in IIS Manager (Sites -> ${{ env.IIS_SITE_NAME }} -> Basic Settings -> Physical path) or: Set-ItemProperty 'IIS:\Sites\${{ env.IIS_SITE_NAME }}' -Name physicalPath -Value '$expectedPhysicalPath'."
          }
          Write-Host "Physical Path OK: $actualPhysicalPath"

          # Capture this site's ACTUAL http binding rather than assuming
          # one - the Application Health Check step builds its request URL
          # from this, not from a hardcoded "http://localhost". IIS routes
          # by exact Host-header match first; a binding with a specific
          # hostname (bindingInformation's 3rd segment, e.g.
          # "testvault-uat.yourdomain.internal" - see docs/DEPLOYMENT.md
          # §1.4's own example) will NEVER match a bare "localhost" request.
          # When that happens, IIS's built-in Default Web Site - which has
          # a blank-hostname (catch-all) binding on port 80 out of the box
          # - answers instead, and its physical path has none of this
          # app's routes: a clean, uniform 404 on /health, /api/*, and
          # /hubs/* alike, with the Application Pool never even entering
          # the picture. This is the most common cause of exactly that
          # symptom, and is why the URL isn't just hardcoded here.
          $httpBindings = @($site.bindings.Collection | Where-Object { $_.protocol -eq 'http' })
          if ($httpBindings.Count -eq 0) {
              throw "IIS site '${{ env.IIS_SITE_NAME }}' has no http binding. Add one: Sites -> ${{ env.IIS_SITE_NAME }} -> Bindings."
          }

          $bindingParts = $httpBindings[0].bindingInformation -split ':'
          $bindingPort = $bindingParts[1]
          $bindingHostHeader = if ($bindingParts.Count -gt 2) { $bindingParts[2] } else { '' }

          Write-Host "HTTP binding: port=$bindingPort, host header=$(if ($bindingHostHeader) { $bindingHostHeader } else { '(none - catch-all)' })"
          "HEALTH_CHECK_PORT=$bindingPort" >> $env:GITHUB_ENV
          "HEALTH_CHECK_HOST_HEADER=$bindingHostHeader" >> $env:GITHUB_ENV

          if ($bindingHostHeader) {
              Write-Warning "Site '${{ env.IIS_SITE_NAME }}' requires Host header '$bindingHostHeader' - Application Health Check will send it explicitly. A request without it (e.g. a browser hitting this server's bare IP) will be served by Default Web Site or another site instead, not this one."
          }

          # appcmd.exe is what the Deploy Release / Rollback On Failure steps
          # use to stop/start the Application Pool (see their own comments
          # for why, versus Stop-WebAppPool/Start-WebAppPool) - confirmed
          # present here so a missing/non-standard IIS install fails fast,
          # with a clear message, instead of mid-deployment.
          $appcmdPath = Join-Path $env:WINDIR "System32\inetsrv\appcmd.exe"
          if (!(Test-Path $appcmdPath)) {
              throw "appcmd.exe not found at $appcmdPath. Confirm IIS is actually installed on this runner (not just the WebAdministration PowerShell module)."
          }
          "APPCMD_PATH=$appcmdPath" >> $env:GITHUB_ENV

          # Diagnostic only - never fails this step. Stopping/starting the
          # Application Pool later requires the account running this
          # workflow to be a local Administrator on this server; IIS_IUSRS
          # membership and NTFS "Modify" on the deployment folder do NOT
          # grant that (IIS_IUSRS is the app pool WORKER PROCESS identity
          # group, not an IIS management group; NTFS rights on
          # E:\AllWebApplication\TestVault only cover site content, not
          # applicationHost.config / WAS). Surfaced here, early and clearly,
          # instead of only ever showing up as a bare "Access is denied"
          # from Stop-WebAppPool three steps later.
          $currentIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $isAdmin = ([Security.Principal.WindowsPrincipal]$currentIdentity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Running as: $($currentIdentity.Name)"
          if ($isAdmin) {
              Write-Host "Local Administrator: Yes - Application Pool control (stop/start) should succeed."
          } else {
              Write-Warning "Local Administrator: No. '$($currentIdentity.Name)' is not in the local Administrators group on this server - Stop/Start Application Pool will very likely fail with 'Access is denied' in the Deploy Release step. Add this account to the local Administrators group and restart the runner service before retrying (see docs/DEPLOYMENT.md §1.8)."
          }

          Write-Host "Environment OK"

      # ======================================
      # Restore Dependencies
      # ======================================

      - name: Restore Dependencies
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Restoring NuGet Packages"
          Write-Host "======================================"

          dotnet restore "${{ env.SOLUTION }}"
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

          Write-Host "Restore Completed Successfully"

      # ======================================
      # Build Application
      # ======================================

      - name: Build Application
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Building Application ($env:BUILD_CONFIGURATION)"
          Write-Host "======================================"

          dotnet build "${{ env.SOLUTION }}" `
            --configuration "${{ env.BUILD_CONFIGURATION }}" `
            --no-restore

          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          Write-Host "Build Completed Successfully"

      # ======================================
      # Prepare Deployment Directories
      # ======================================

      - name: Prepare Deployment Directories
        shell: powershell
        run: |
          Write-Host "Preparing deployment directories"

          foreach ($path in @(
              "${{ env.BASE_PATH }}",
              "${{ env.RELEASE_PATH }}",
              "${{ env.CURRENT_PATH }}",
              "${{ env.BACKUP_PATH }}"
          )) {
              New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          Write-Host "Deployment directories ready"

      # ======================================
      # Create Release Folder
      # ======================================

      - name: Create New Release
        shell: powershell
        run: |
          $releaseName = "Release_$(Get-Date -Format 'yyyyMMdd_HHmmss')"
          $releasePath = Join-Path "${{ env.RELEASE_PATH }}" $releaseName

          New-Item -ItemType Directory -Path $releasePath -Force | Out-Null

          "NEW_RELEASE=$releasePath" >> $env:GITHUB_ENV

          Write-Host "Release Created:"
          Write-Host $releasePath

      # ======================================
      # Publish Application
      # ======================================

      - name: Publish Application
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Publishing Application"
          Write-Host "======================================"

          dotnet publish "${{ env.WEB_PROJECT }}" `
            --configuration "${{ env.BUILD_CONFIGURATION }}" `
            --output "${{ env.NEW_RELEASE }}" `
            --no-build

          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }

          $publishedFiles = Get-ChildItem "${{ env.NEW_RELEASE }}" -Force -ErrorAction SilentlyContinue
          if ($null -eq $publishedFiles -or $publishedFiles.Count -eq 0) {
              throw "Published release folder is empty"
          }

          # dotnet publish generates web.config automatically for
          # Microsoft.NET.Sdk.Web projects - this is what wires up ANCM
          # inside IIS, and what the next step sets ASPNETCORE_ENVIRONMENT
          # in (secrets themselves come from the server's Application Pool
          # environment, not from this file - see that step's header).
          if (!(Test-Path "${{ env.NEW_RELEASE }}\web.config")) {
              throw "web.config was not found in published output. Confirm the web project targets Microsoft.NET.Sdk.Web."
          }

          Write-Host "Publish Completed Successfully"
          Write-Host "Release Package:"
          Write-Host "${{ env.NEW_RELEASE }}"

      # ======================================
      # Configure Environment Variables
      #
      # PRODUCTION CONFIGURATION LIVES ON THE SERVER, NOT IN GITHUB.
      #
      # ConnectionStrings__DefaultConnection, Jwt__Secret and AI__ApiKey are
      # NOT read from GitHub Actions secrets and are NOT written into
      # web.config by this workflow. This repository never holds a real
      # connection string, JWT secret or API key (see TestVault.Web/
      # appsettings*.json's own "// NOTE" entries) - and since `dotnet
      # publish` above regenerates a brand-new web.config on every single
      # deployment, anything this step wrote into it would only live as
      # long as the next release anyway. A value that must survive across
      # deployments has to live somewhere `dotnet publish` never touches:
      # the IIS Application Pool itself.
      #
      # >>> ONE-TIME SERVER SETUP (do this on the IIS box, not in CI) <<<
      # Set these as environment variables on the "${{ env.IIS_APP_POOL }}"
      # Application Pool (IIS 10 / Windows Server 2016+ feature - the ASP.NET
      # Core Module (ANCM) launches w3wp.exe with these already in its
      # process environment, so TestVault.Web picks them up exactly like any
      # other environment variable - no web.config entry required):
      #
      #   Import-Module WebAdministration
      #   $pool = "${{ env.IIS_APP_POOL }}"
      #   foreach ($kv in @{
      #       'ConnectionStrings__DefaultConnection' = '<real SQL Server connection string>'
      #       'Jwt__Secret'                          = '<random, 32+ chars - see Program.cs>'
      #       'AI__ApiKey'                            = '<Anthropic API key - optional>'
      #   }.GetEnumerator()) {
      #       Add-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      #           -Filter "system.applicationHost/applicationPools/add[@name='$pool']/environmentVariables" `
      #           -Name "." -Value @{ name = $kv.Key; value = $kv.Value }
      #   }
      #   Restart-WebAppPool -Name $pool
      #
      # Equivalent GUI path: IIS Manager -> Application Pools -> select the
      # pool -> Configuration Editor -> section
      # system.applicationHost/applicationPools -> find this pool's entry ->
      # environmentVariables -> Add. See docs/DEPLOYMENT.md §4 for the full
      # walkthrough, including how to update/rotate a value later.
      #
      # This step only ever sets ASPNETCORE_ENVIRONMENT, which is not a
      # secret and is the same for every deployment - it belongs in
      # web.config (it's what makes TestVault.Web load
      # appsettings.Production.json at all) and has no reason to be
      # maintained by hand on the server.
      # ======================================

      - name: Configure Environment Variables
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Configuring Environment Variables"
          Write-Host "======================================"

          $webConfigPath = Join-Path "${{ env.NEW_RELEASE }}" "web.config"
          [xml]$webConfig = Get-Content $webConfigPath

          # A recursive XPath lookup (not a fixed configuration/system.webServer/...
          # property chain) - dotnet publish wraps system.webServer in a
          # <location path="."> element, which a fixed chain silently misses
          # (verified against a real `dotnet publish` output while writing
          # this - $webConfig.configuration.'system.webServer' resolves to
          # nothing on the actual generated file). //aspNetCore finds it
          # regardless of the exact wrapping IIS/the SDK happens to use.
          $aspNetCoreNode = $webConfig.SelectSingleNode("//aspNetCore")
          if ($null -eq $aspNetCoreNode) {
              throw "web.config has no aspNetCore node anywhere - was this really published from a Microsoft.NET.Sdk.Web project?"
          }

          $envVarsNode = $aspNetCoreNode.SelectSingleNode("environmentVariables")
          if ($null -eq $envVarsNode) {
              $envVarsNode = $webConfig.CreateElement("environmentVariables")
              $aspNetCoreNode.AppendChild($envVarsNode) | Out-Null
          }

          function Set-AncmEnvVar {
              param([string]$Name, [string]$Value)

              $existing = $envVarsNode.SelectSingleNode("add[@name='$Name']")
              if ($null -eq $existing) {
                  $existing = $webConfig.CreateElement("add")
                  $existing.SetAttribute("name", $Name) | Out-Null
                  $envVarsNode.AppendChild($existing) | Out-Null
              }
              $existing.SetAttribute("value", $Value) | Out-Null
          }

          Set-AncmEnvVar -Name "ASPNETCORE_ENVIRONMENT" -Value "Production"
          $webConfig.Save($webConfigPath)

          Write-Host "web.config: ASPNETCORE_ENVIRONMENT=Production set."
          Write-Host ""
          Write-Host "ConnectionStrings__DefaultConnection / Jwt__Secret / AI__ApiKey are"
          Write-Host "intentionally NOT written here - they must be configured once on this"
          Write-Host "server as '${{ env.IIS_APP_POOL }}' Application Pool environment"
          Write-Host "variables (see this step's header comment, or docs/DEPLOYMENT.md §4)."

          # Informational only - never fails the deployment. TestVault.Web's
          # own startup check (Program.cs) already refuses to boot without a
          # valid Jwt:Secret, and this workflow's Health Check + Rollback
          # steps already catch and undo a deployment that comes up
          # unhealthy for any reason, including a missing connection string.
          # This just surfaces the likely cause earlier, in this step's log,
          # instead of making someone dig through a failed health check.
          Import-Module WebAdministration
          $poolEnvVars = @(
              Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
                  -Filter "system.applicationHost/applicationPools/add[@name='${{ env.IIS_APP_POOL }}']/environmentVariables" `
                  -Name "." -ErrorAction SilentlyContinue |
                  ForEach-Object { $_.name }
          )

          Write-Host ""
          Write-Host "Application Pool '${{ env.IIS_APP_POOL }}' environment variables:"
          foreach ($required in @('ConnectionStrings__DefaultConnection', 'Jwt__Secret')) {
              if ($poolEnvVars -contains $required) {
                  Write-Host "  [OK]      $required is configured on the Application Pool."
              } else {
                  Write-Warning "  [MISSING] $required is not set on Application Pool '${{ env.IIS_APP_POOL }}'. TestVault.Web will fail to start until it is - see this step's header comment for the one-time setup command."
              }
          }
          if ($poolEnvVars -contains 'AI__ApiKey') {
              Write-Host "  [OK]      AI__ApiKey is configured on the Application Pool."
          } else {
              Write-Host "  [SKIPPED] AI__ApiKey is not set - optional, only required for AI failure analysis."
          }

      # ======================================
      # Backup Current Deployment
      # ======================================

      - name: Backup Current Version
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Backing Up Current Version"
          Write-Host "======================================"

          $current = "${{ env.CURRENT_PATH }}"
          $items = Get-ChildItem $current -Force -ErrorAction SilentlyContinue

          if ($null -ne $items -and $items.Count -gt 0) {

              $backupName = "Backup_$(Get-Date -Format 'yyyyMMdd_HHmmss')"
              $backupPath = Join-Path "${{ env.BACKUP_PATH }}" $backupName

              New-Item -ItemType Directory -Path $backupPath -Force | Out-Null
              Copy-Item "$current\*" $backupPath -Recurse -Force

              "OLD_BACKUP=$backupPath" >> $env:GITHUB_ENV

              Write-Host "Backup Created:"
              Write-Host $backupPath

          } else {

              Write-Host "Current folder is empty. Backup skipped."
              "OLD_BACKUP=" >> $env:GITHUB_ENV

          }

      # ======================================
      # Switch Current: stop AppPool, copy release in, restart AppPool
      # (a real IIS Application Pool stop/start - legitimate here because
      # TestVault.Web is genuinely IIS-hosted via ANCM)
      #
      # Stop/start go through appcmd.exe, not the WebAdministration module's
      # Stop-WebAppPool/Start-WebAppPool cmdlets. Both ultimately ask WAS
      # (Windows Process Activation Service) to change the pool's state, so
      # appcmd.exe is NOT a way around needing Administrator rights - if the
      # account running this workflow isn't a local Administrator on this
      # server, this step will still fail (see Environment Validation's
      # admin-rights check above, and docs/DEPLOYMENT.md §1.8). It's used here
      # because Stop-WebAppPool/Start-WebAppPool activate an in-process COM
      # object (Microsoft.Web.Administration.ServerManager) whose apartment-
      # threading assumptions are geared toward an interactive PowerShell
      # session; under a non-interactive Windows Service host (exactly how
      # the GitHub Actions runner runs), that activation has been observed
      # to behave inconsistently even for a genuinely privileged account.
      # appcmd.exe is a plain console process with no COM activation step,
      # so it doesn't have that failure mode - and Get-WebAppPoolState
      # below is read-only (confirmed working per the reported Get-Item
      # test), so it's kept as-is for polling.
      # ======================================

      - name: Deploy Release
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Deploying Release"
          Write-Host "======================================"

          Import-Module WebAdministration

          $current = "${{ env.CURRENT_PATH }}"
          $release = "${{ env.NEW_RELEASE }}"
          $appPool = "${{ env.IIS_APP_POOL }}"
          $appcmd  = "${{ env.APPCMD_PATH }}"

          Write-Host "Current Path: $current"
          Write-Host "Release Path: $release"

          function Invoke-AppPoolCommand {
              param(
                  [ValidateSet('stop', 'start')][string]$Action,
                  [string]$Name
              )

              $output = & $appcmd $Action apppool "/apppool.name:$Name" 2>&1 | Out-String
              Write-Host $output.Trim()

              # appcmd exits non-zero, and its own message says so plainly,
              # for a pool that's already in the requested state - not a
              # real failure, so it's excluded from the throw below.
              if ($LASTEXITCODE -ne 0 -and $output -notmatch 'already (stopped|started)') {
                  throw "appcmd.exe failed to $Action Application Pool '$Name' (exit $LASTEXITCODE): $($output.Trim()) -- This is almost always a Windows permissions problem, not a bug in this workflow: the account running the GitHub Actions runner service must be a member of the local Administrators group on this server to control IIS Application Pools. IIS_IUSRS membership and NTFS folder permissions on $env:BASE_PATH are NOT sufficient for this. See docs/DEPLOYMENT.md §1.8."
              }
          }

          Write-Host "Stopping Application Pool: $appPool"
          Invoke-AppPoolCommand -Action stop -Name $appPool

          $timeout = (Get-Date).AddSeconds(30)
          while ((Get-WebAppPoolState -Name $appPool).Value -ne 'Stopped' -and (Get-Date) -lt $timeout) {
              Start-Sleep -Seconds 1
          }
          if ((Get-WebAppPoolState -Name $appPool).Value -ne 'Stopped') {
              throw "Application Pool '$appPool' did not stop within 30 seconds"
          }

          Write-Host "Removing previous application files"
          Get-ChildItem $current -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Write-Host "Copying new release to Current"
          Copy-Item "$release\*" $current -Recurse -Force

          if (!(Test-Path "$current\web.config")) {
              throw "Deployment verification failed: web.config not found"
          }

          Write-Host "Starting Application Pool: $appPool"
          Invoke-AppPoolCommand -Action start -Name $appPool

          $timeout = (Get-Date).AddSeconds(30)
          while ((Get-WebAppPoolState -Name $appPool).Value -ne 'Started' -and (Get-Date) -lt $timeout) {
              Start-Sleep -Seconds 1
          }
          if ((Get-WebAppPoolState -Name $appPool).Value -ne 'Started') {
              throw "Application Pool '$appPool' did not start within 30 seconds"
          }

          Write-Host "Deployment Completed Successfully"

      # ======================================
      # Health Check
      #   - Application returns HTTP 200 (GET /health)
      #   - An API endpoint is reachable (GET /api/runs)
      #   - The SignalR negotiate endpoint is reachable (POST /hubs/run/negotiate)
      #
      # Both the API and hub endpoints require authentication by default
      # (Program.cs's global fallback authorization policy) and this check
      # has no test user's credentials to present - a 401 on those two
      # means "reachable and correctly enforcing authentication", which
      # IS the healthy outcome for an unauthenticated probe. Only a
      # connection failure, a 5xx, or an unexpected status fails the check.
      # ======================================

      - name: Application Health Check
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Application Health Check"
          Write-Host "======================================"

          Write-Host "Waiting ${{ env.STARTUP_WAIT_SECONDS }}s for application startup..."
          Start-Sleep -Seconds ([int]"${{ env.STARTUP_WAIT_SECONDS }}")

          $healthUrlOverride = "${{ github.event.inputs.health_url }}"
          $headers = @{}

          if (-not [string]::IsNullOrWhiteSpace($healthUrlOverride)) {
              # An explicit override always wins - whoever passed
              # workflow_dispatch's health_url is targeting a specific,
              # already-known-good URL (e.g. a real public hostname) and
              # doesn't need the binding-derived logic below.
              $baseUrl = $healthUrlOverride.TrimEnd('/')
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ env.HEALTH_CHECK_PORT }}")) {
              # Built from THIS site's actual IIS binding, captured in
              # Environment Validation - not a hardcoded "http://localhost"
              # - see that step's comment for why a hardcoded assumption
              # here is exactly what let a 404-for-everything deployment
              # look "healthy enough to attempt" in the first place.
              $port = "${{ env.HEALTH_CHECK_PORT }}"
              $bindingHostHeader = "${{ env.HEALTH_CHECK_HOST_HEADER }}"
              $portSuffix = if ($port -ne '80') { ":$port" } else { '' }
              $baseUrl = "http://localhost$portSuffix"

              if (-not [string]::IsNullOrWhiteSpace($bindingHostHeader)) {
                  $headers['Host'] = $bindingHostHeader
                  Write-Host "Sending Host header '$bindingHostHeader' to match IIS site '${{ env.IIS_SITE_NAME }}' binding."
              }
          } else {
              # Fallback only - Environment Validation normally always sets
              # HEALTH_CHECK_PORT; this covers a re-run that somehow skipped it.
              $baseUrl = "${{ env.HEALTH_BASE_URL }}".TrimEnd('/')
          }

          Write-Host "Health check target: $baseUrl (Host header: $(if ($headers['Host']) { $headers['Host'] } else { '(default)' }))"

          Import-Module WebAdministration
          $poolState = (Get-WebAppPoolState -Name "${{ env.IIS_APP_POOL }}").Value
          Write-Host "Application Pool state: $poolState"
          if ($poolState -ne 'Started') {
              throw "Application Health Check Failed: App Pool '${{ env.IIS_APP_POOL }}' is not running"
          }

          function Test-Endpoint {
              param(
                  [string]$Name,
                  [string]$Url,
                  [string]$Method = 'GET',
                  [bool]$AllowUnauthorized = $false,
                  [hashtable]$Headers = @{}
              )

              Write-Host "Checking $Name : $Method $Url"
              try {
                  $response = Invoke-WebRequest -Uri $Url -Method $Method -Headers $Headers -UseBasicParsing -TimeoutSec 30
                  Write-Host "  -> HTTP $($response.StatusCode)"
                  return $true
              } catch {
                  $statusCode = $null
                  if ($_.Exception.Response) {
                      $statusCode = [int]$_.Exception.Response.StatusCode
                  }

                  if ($AllowUnauthorized -and $statusCode -eq 401) {
                      Write-Host "  -> HTTP 401 (authentication required) - endpoint is reachable and enforcing auth correctly."
                      return $true
                  }

                  Write-Host "  -> FAILED: $($_.Exception.Message)"
                  return $false
              }
          }

          $healthOk    = Test-Endpoint -Name "Application health"    -Url "$baseUrl/health" -Headers $headers
          $apiOk       = Test-Endpoint -Name "API endpoint"          -Url "$baseUrl/api/runs" -AllowUnauthorized $true -Headers $headers
          $signalROk   = Test-Endpoint -Name "SignalR negotiate"     -Url "$baseUrl/hubs/run/negotiate" -Method 'POST' -AllowUnauthorized $true -Headers $headers

          if (-not ($healthOk -and $apiOk -and $signalROk)) {
              throw "Application Health Check Failed (health: $healthOk, api: $apiOk, signalr: $signalROk)"
          }

          Write-Host "======================================"
          Write-Host "Application Healthy"
          Write-Host "======================================"

      # ======================================
      # Rollback
      # Runs only if a previous step (typically the health check) failed.
      # ======================================

      - name: Rollback On Failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DEPLOYMENT FAILED - ROLLING BACK"
          Write-Host "======================================"

          Import-Module WebAdministration

          $current = "${{ env.CURRENT_PATH }}"
          $oldBackup = "${{ env.OLD_BACKUP }}"
          $appPool = "${{ env.IIS_APP_POOL }}"
          $appcmd  = "${{ env.APPCMD_PATH }}"

          if ([string]::IsNullOrWhiteSpace($oldBackup) -or -not (Test-Path $oldBackup)) {
              Write-Warning "No previous backup available to roll back to. Manual intervention required."
              exit 1
          }

          # Same appcmd.exe-based stop/start as Deploy Release, and for the
          # same reason (see that step's comment) - both non-fatal here,
          # matching the previous -ErrorAction SilentlyContinue behavior,
          # since a rollback must still attempt to restore Current even if
          # the pool was already stopped (or, in the worst case, this same
          # permissions problem is what triggered the rollback in the first
          # place).
          Write-Host "Stopping Application Pool: $appPool"
          & $appcmd stop apppool "/apppool.name:$appPool" 2>&1 | ForEach-Object { Write-Host $_ }
          Start-Sleep -Seconds 5

          Write-Host "Restoring previous version from: $oldBackup"
          Get-ChildItem $current -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Copy-Item "$oldBackup\*" $current -Recurse -Force

          Write-Host "Starting Application Pool: $appPool"
          & $appcmd start apppool "/apppool.name:$appPool" 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
              Write-Warning "Application Pool '$appPool' failed to start during rollback - if this is the same 'Access is denied' issue, restoring Current's files still succeeded, but the site will stay down until the permissions problem is fixed and the pool is started manually."
          }

          Write-Host "Rollback complete. Previous stable version restored."
          Write-Host "Failing this job so the failed deployment is visible."
          exit 1

      # ======================================
      # Cleanup Old Releases (only after a successful deployment)
      # ======================================

      - name: Cleanup Old Releases
        if: success()
        shell: powershell
        run: |
          Write-Host "Cleaning old releases"

          $keep = [int]"${{ env.RELEASES_TO_KEEP }}"

          if (Test-Path "${{ env.RELEASE_PATH }}") {
              $releases = Get-ChildItem "${{ env.RELEASE_PATH }}" -Directory |
                            Sort-Object CreationTime -Descending

              if ($releases.Count -gt $keep) {
                  $releases | Select-Object -Skip $keep | Remove-Item -Recurse -Force
                  Write-Host "Old releases removed."
              } else {
                  Write-Host "No old releases to remove."
              }
          }

      # ======================================
      # Cleanup Old Backups (only after a successful deployment)
      # ======================================

      - name: Cleanup Old Backups
        if: success()
        shell: powershell
        run: |
          Write-Host "Cleaning old backups"

          $keep = [int]"${{ env.BACKUPS_TO_KEEP }}"

          if (Test-Path "${{ env.BACKUP_PATH }}") {
              $backups = Get-ChildItem "${{ env.BACKUP_PATH }}" -Directory |
                           Sort-Object CreationTime -Descending

              if ($backups.Count -gt $keep) {
                  $backups | Select-Object -Skip $keep | Remove-Item -Recurse -Force
                  Write-Host "Old backups removed."
              } else {
                  Write-Host "No old backups to remove."
              }
          }
